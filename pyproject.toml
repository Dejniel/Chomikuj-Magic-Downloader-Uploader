[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chomikuj-magic"
version = "0.5.2"
description = "Desktop client for downloading and uploading files from Chomikuj.pl"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "platformdirs>=4,<5",
    "requests>=2.32,<3",
]

[project.scripts]
chomikuj-magic-cli = "chomikuj.cli:main"

[project.gui-scripts]
chomikuj-magic-gui = "chomikuj.gui:main"

[project.urls]
Homepage = "https://github.com/Dejniel/Chomikuj-Magic-Downloader-Uploader"
Issues = "https://github.com/Dejniel/Chomikuj-Magic-Downloader-Uploader/issues"

[tool.setuptools.packages.find]
include = ["chomikuj*"]
