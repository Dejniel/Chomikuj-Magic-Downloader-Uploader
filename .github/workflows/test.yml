name: Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . build
          python -m unittest discover -v
          python -m build

      - name: Test installed commands
        run: |
          python -m pip install --force-reinstall dist/*.whl
          chomikuj-magic-cli --help
          python -c "from importlib.metadata import entry_points; names = {item.name for item in entry_points(group='gui_scripts')}; assert 'chomikuj-magic-gui' in names"
